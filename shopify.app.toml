# Konfiguration af PREAURA i Shopify.
# Distribution (offentlig / App Store) vælges i Dev Dashboard og kan ikke
# ændres bagefter.
#
# OBS: `shopify app config link` overskriver denne fil med appens tomme
# standardkonfiguration og sletter bl.a. scopes. Kør `git diff` bagefter.
client_id = "5021b1e5a0b9cb456c79906ba0d09bd4"
name = "PREAURA"
embedded = true
# Pladsholder. `npm run dev` sætter selv tunnel-adressen under udvikling.
application_url = "https://shopify.dev/apps/default-app-home"

[build]
# `npm run dev` skriver selv tunnel-adressen ind i appens URL'er.
automatically_update_urls_on_dev = true
include_config_on_deploy = true

[auth]
# Pladsholder. Sættes til den rigtige server-adresse ved udrulning.
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[access_scopes]
# Kun disse seks. Hvert ekstra scope forlænger Shopifys gennemgang.
scopes = "read_products,write_products,read_inventory,write_inventory,read_orders,write_orders"

[webhooks]
api_version = "2026-10"

  # Lovpligtige compliance-webhooks (krævet for apps i App Store).
  # Håndteres af: /app/routes/webhooks.compliance.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/compliance"
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]

  # Ordrer. Håndteres af: /app/routes/webhooks.orders.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/orders"
  topics = ["orders/create", "orders/updated", "orders/cancelled"]

  # Håndteres af: /app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/uninstalled"
  topics = ["app/uninstalled"]

  # Holder gemte sessioners scopes ajour. Fra Shopifys skabelon.
  # Håndteres af: /app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  uri = "/webhooks/app/scopes_update"
  topics = ["app/scopes_update"]
