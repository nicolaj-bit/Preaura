<!doctype html><html><head><meta charset="utf-8">
<script src="https://cdn.shopify.com/shopifycloud/polaris.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@400;500&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4EEE8;--ink:#2A2420;--bronze:#9A7A68;--soft:#6B5F57;--line:#E4D9CF}
*{box-sizing:border-box;margin:0}
body{width:1600px;height:900px;overflow:hidden;position:relative;font-family:Jost,sans-serif;color:var(--ink);
 background:radial-gradient(1200px 800px at 85% 20%,#FBF7F3 0%,#F1E8E0 45%,#E9DED3 100%)}
body.dark{--bg:#221C19;--ink:#F4EEE8;--soft:#CDBFB4;background:radial-gradient(1200px 900px at 75% 30%,#4A3E37 0%,#2A2420 50%,#1B1614 100%)}
/* ringen fra logoet */
.ring{position:absolute;border-radius:50%;border:2px solid transparent;
 background:linear-gradient(90deg,rgba(184,152,138,.15),#E9D6C8,#B08A76,rgba(142,107,91,.3)) border-box;
 -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.copy{position:absolute;left:100px;top:0;bottom:0;width:520px;display:flex;flex-direction:column;justify-content:center;gap:26px;z-index:3}
.eyebrow{font-weight:500;font-size:16px;letter-spacing:.34em;text-transform:uppercase;color:var(--bronze)}
h1{text-wrap:balance;font-family:Marcellus,serif;font-weight:400;font-size:52px;line-height:1.1}
.sub{font-size:21px;line-height:1.55;color:var(--soft);max-width:470px}
.brand{position:absolute;left:100px;bottom:58px;font-family:Marcellus,serif;font-size:24px;letter-spacing:.16em;z-index:3}
.brand b{color:var(--bronze);font-weight:400}
.photo{position:absolute;border-radius:28px;background-size:cover;background-position:center;box-shadow:0 40px 90px rgba(42,36,32,.28)}
.card{position:absolute;background:#F7F3EF;color:#3B3532;border-radius:20px;padding:30px 32px;font-family:"Helvetica Neue",Arial,sans-serif;font-size:17px;
 box-shadow:0 30px 70px rgba(42,36,32,.22),0 2px 8px rgba(42,36,32,.08);z-index:2}
.card .title{font-family:"Playfair Display",serif;font-size:30px;color:#3B3532;margin-bottom:6px}
.card .price{font-size:18px;margin-bottom:4px}
.btn{margin-top:14px;padding:15px;text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;background:#DCD3C8;color:#3B3532}
.btn.dark{background:#3B3532;color:#F7F3EF}
.small{font-size:14px;opacity:.75}
.tag{display:inline-block;font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-bottom:14px}
.line{display:flex;gap:16px;align-items:flex-start;padding-bottom:18px;border-bottom:1px solid #E2D9CF;margin-bottom:18px}
.thumb{width:76px;height:76px;border-radius:6px;background-size:cover;background-position:center;flex:none}
.highlight{outline:2px solid rgba(154,122,104,.55);outline-offset:8px;border-radius:6px}
/* PREAURAs egen stil (fra blocks/preorder.liquid og blocks/cart.liquid) */
.preaura{display:flex;flex-direction:column;gap:.75em;margin:1.1em 0 0;padding:1.1em 1.25em;border:1px solid;border-color:color-mix(in srgb,currentColor 18%,transparent);border-radius:.6em}
.preaura p{margin:0}
.preaura__message{font-weight:600}
.preaura__remaining{display:flex;align-items:center;gap:.5em}
.preaura__remaining::before{content:"";flex:none;width:.5em;height:.5em;border-radius:50%;background:currentColor}
.preaura__note{font-size:.875em;opacity:.75}
.preaura__timeline{padding-top:.85em;border-top:1px solid;border-color:color-mix(in srgb,currentColor 12%,transparent)}
.preaura__timeline-heading{margin-bottom:.7em!important;font-size:.75em;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.preaura__timeline ol{list-style:none;margin:0;padding:0}
.preaura__timeline li{position:relative;display:flex;justify-content:space-between;gap:1em;padding:0 0 .75em 1.6em}
.preaura__timeline li:last-child{padding-bottom:0}
.preaura__timeline li::before{content:"";position:absolute;left:0;top:.4em;width:.65em;height:.65em;box-sizing:border-box;border:1.5px solid currentColor;border-radius:50%}
.preaura__timeline li::after{content:"";position:absolute;left:.3em;top:1.25em;bottom:.15em;width:1px;background:currentColor;opacity:.25}
.preaura__timeline li:last-child::after{display:none}
.preaura__timeline li[data-state=CURRENT]{font-weight:600}
.preaura__timeline li[data-state=CURRENT]::before{background:currentColor}
.preaura__timeline li[data-state=SOLD_OUT]{opacity:.5}
.preaura__timeline li[data-state=SOLD_OUT] .preaura__date{text-decoration:line-through}
.preaura__state{text-align:right;opacity:.8}
.preaura__waitlist{display:flex;flex-direction:column;gap:.6em}
.preaura__waitlist-heading{font-weight:600}
.preaura__label{font-size:.875em;opacity:.8}
.preaura__input{width:100%;padding:.75em 1em;font:inherit;color:#9A918A;border:1px solid;border-color:color-mix(in srgb,currentColor 35%,transparent);border-radius:.4em}
.preaura__privacy{font-size:.8em;opacity:.7}
.preaura-cart-note{display:block;font-size:15px;opacity:.85}
.preaura-cart-totals{display:flex;flex-direction:column;gap:.45em}
.preaura-cart-totals>div{display:flex;justify-content:space-between;gap:1em;font-size:19px}
.preaura-cart-totals>div:last-child{font-weight:600;font-size:22px}

.glow{position:absolute;border-radius:50%;filter:blur(10px);background:radial-gradient(circle,rgba(176,138,118,.45),rgba(176,138,118,0) 68%);z-index:0}
.ring.front{display:none}
.ring{z-index:1}
body.dark .panel{box-shadow:0 40px 100px rgba(0,0,0,.55)}
body.dark{--ink:#F4EEE8;--soft:#CDBFB4;background:radial-gradient(1200px 900px at 75% 30%,#4A3E37 0%,#2A2420 50%,#1B1614 100%)}
.panel{position:absolute;right:70px;top:50%;transform:translateY(-50%);width:900px;background:#F1F1F1;border-radius:24px;overflow:hidden;
 box-shadow:0 40px 90px rgba(42,36,32,.28),0 2px 8px rgba(42,36,32,.08);z-index:2;padding:26px;font-family:Inter,-apple-system,"Segoe UI",sans-serif}
.panel .bar{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:#303030;margin:0 0 18px 4px}
.panel .bar img{width:26px;height:26px;border-radius:7px}
.bar-progress{width:150px;height:8px;border-radius:4px;background:#e3e3e3;overflow:hidden}.bar-progress i{display:block;height:100%;background:#303030}
.copy{width:470px}
</style></head><body><script>if(new URLSearchParams(location.search).get("anim"))document.write(`
<style id="anim">
@keyframes fadeUp{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;translate:0 60px;scale:.96}100%{opacity:1;translate:0 0;scale:1}}
@keyframes ringIn{from{opacity:0;transform:var(--r) scale(.85)}to{opacity:1;transform:var(--r) scale(1)}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(176,138,118,0)}50%{box-shadow:0 0 0 14px rgba(176,138,118,.25)}}
.eyebrow{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) .2s both}
h1{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) .4s both}
.sub{animation:fadeUp .9s cubic-bezier(.2,.7,.2,1) .7s both}
.brand{animation:fadeIn 1s ease 1s both}
.glow{animation:fadeIn 1.6s ease both}
.ring{animation:fadeIn 1.4s ease .3s both}
.card,.panel{animation:pop 1s cubic-bezier(.2,.7,.2,1) .6s both}
.card+.card{animation-delay:1.3s}
.preaura__timeline li{animation:fadeUp .6s ease both}
.preaura__timeline li:nth-child(1){animation-delay:1.8s}.preaura__timeline li:nth-child(2){animation-delay:2.1s}.preaura__timeline li:nth-child(3){animation-delay:2.4s}
.highlight{animation:pulse 1.6s ease 2s 2 both}
s-grid>s-box{animation:fadeUp .6s ease both}
s-grid>s-box:nth-child(1){animation-delay:1.3s}s-grid>s-box:nth-child(2){animation-delay:1.4s}s-grid>s-box:nth-child(3){animation-delay:1.5s}s-grid>s-box:nth-child(4){animation-delay:1.6s}
s-grid>s-box:nth-child(5){animation-delay:1.7s}s-grid>s-box:nth-child(6){animation-delay:1.8s}s-grid>s-box:nth-child(7){animation-delay:1.9s}s-grid>s-box:nth-child(8){animation-delay:2s}
s-table-row{animation:fadeUp .6s ease both}
s-table-row:nth-child(1){animation-delay:2.2s}s-table-row:nth-child(2){animation-delay:2.4s}s-table-row:nth-child(3){animation-delay:2.6s}
</style>`)</script><div id="root"></div>
<script>
const q=new URLSearchParams(location.search),L=q.get('lang')||'da',S=q.get('s')||'5';
const T={da:{
 s5:['Overblik','Hele forudbestillingen på én side','Beløb, ordrer, ventende varer og næste leverance, og det, der kræver handling, i den periode du vælger.'],
 s6:['Styring','Du sætter leverancerne, appen klarer resten','Opret hver leverance med dato og antal. Appen skifter selv mellem lager og forudbestilling og holder Shopifys lager i takt.'],
 overview:'Oversigt',intro:'Forudbestillinger fra ordrer i perioden. Beløb i butikkens valuta.',p:['7 dage','30 dage','90 dage'],
 stats:[['money','Forudbestilt for','48.230 kr','↑ 18 %'],['order','Ordrer','37','↑ 12 %'],['receipt','Gns. ordreværdi','1.304 kr',''],['product','Forudbestilte stk.','52 stk.',''],
        ['delivery','Venter på varer','52 stk.',''],['calendar','Næste leverance','28. nov. 2026',''],['credit-card-cancel','Afviste betalinger','1',''],['x-circle','Annulleringsønsker','2','']],
 deliveries:'Leverancer',cols:['Produkt','Dato','Solgt','Status'],
 rows:[['Luksus sengeslange','Sage','28. november 2026',34,40,'Aktiv','success'],['Månepude','Karry','19. december 2026',12,30,'Aktiv','success'],['Luksus sengeslange','Sage','23. januar 2027',0,60,'Kommende','']],
 of:'af',
 variant:'Sage',toggle:'Forudbestilling, når lageret er tomt',toggleD:'Appen skifter selv: lager, når der er varer på hylden, og forudbestilling, når lageret rammer 0, og der er plads i en leverance.',
 active:'Aktiv leverance',activeV:'Nr. 2 · 28. november 2026',stock:'Lager i Shopify nu',stockV:'6 stk.',synced:'Sidst synkroniseret',syncedV:'16. nov. 2026 12.34',sync:'Synkroniser',

 force:'Tving forudbestilling',
 dcols:['Nr.','Dato','Antal','Tildelt','Tilbage','Status'],
 drows:[['1','14. november 2026','25','25','0','Udsolgt','warning'],['2','28. november 2026','40','34','6','Aktiv','success'],['3','19. december 2026','60','0','60','Kommende','']],
 newD:'Ny leverance',date:'Dato',qty:'Antal',add:'Tilføj leverance'},
en:{
 s5:['Overview','Every pre-order on one page','Amounts, orders, units waiting and the next delivery, plus what needs your attention, for the period you choose.'],
 s6:['Control','You set the deliveries, the app does the rest','Add each delivery with a date and quantity. The app switches between stock and pre-order by itself and keeps Shopify’s inventory in step.'],
 overview:'Overview',intro:'Pre-orders from orders in the period. Amounts in the store’s currency.',p:['7 days','30 days','90 days'],
 stats:[['money','Pre-ordered for','DKK 48,230.00','↑ 18 %'],['order','Orders','37','↑ 12 %'],['receipt','Avg. order value','DKK 1,303.51',''],['product','Units pre-ordered','52 units',''],
        ['delivery','Waiting for stock','52 units',''],['calendar','Next delivery','November 28, 2026',''],['credit-card-cancel','Declined payments','1',''],['x-circle','Cancellation requests','2','']],
 deliveries:'Deliveries',cols:['Product','Date','Sold','Status'],
 rows:[['Luxury bed bumper','Sage','November 28, 2026',34,40,'Active','success'],['Moon pillow','Curry','December 19, 2026',12,30,'Active','success'],['Luxury bed bumper','Sage','January 23, 2027',0,60,'Upcoming','']],
 of:'of',
 variant:'Sage',toggle:'Pre-order when out of stock',toggleD:'The app switches by itself: selling from stock while there are items on the shelf, and pre-order when stock reaches 0 and a delivery has room.',
 active:'Active delivery',activeV:'No. 2 · November 28, 2026',stock:'Stock in Shopify now',stockV:'6 units',synced:'Last synced',syncedV:'Nov 16, 2026, 12:34 PM',sync:'Sync',
 mode:'Current mode:',modeV:'Pre-order (automatic)',modeT:'Stock is empty. Customers can pre-order, and the app manages the stock from the deliveries. If you add stock, the variant switches back by itself once the pre-orders are covered.',
 force:'Force pre-order',
 dcols:['No.','Date','Quantity','Allocated','Remaining','Status'],
 drows:[['1','November 14, 2026','25','25','0','Sold out','warning'],['2','November 28, 2026','40','34','6','Active','success'],['3','December 19, 2026','60','0','60','Upcoming','']],
 newD:'New delivery',date:'Date',qty:'Quantity',add:'Add delivery'}}[L];
const thumbs={'Luksus sengeslange':'img/sengeslange1.jpg','Luxury bed bumper':'img/sengeslange1.jpg','Månepude':'img/manepude-2.jpg','Moon pillow':'img/manepude-2.jpg'};
const [eb,h,sub]=S==='5'?T.s5:T.s6;
const ring=(l,t,w,hh,r)=>{const st=`left:${l}px;top:${t}px;width:${w}px;height:${hh}px;transform:rotate(${r}deg)`;return `<div class="ring" style="${st}"></div><div class="ring front" style="${st}"></div>`};
if(S==='5') document.body.classList.add('dark');
let panel='';
if(S==='5'){
 const stat=([i,l,v,tr])=>`<s-box padding="base" border="base" borderRadius="base" background="base"><s-stack gap="small-200"><s-stack direction="inline" gap="small-200" alignItems="center"><s-icon type="${i}" size="small"></s-icon><s-text color="subdued">${l}</s-text></s-stack><s-stack direction="inline" gap="small-200" alignItems="center"><s-heading>${v}</s-heading>${tr?`<s-badge tone="success">${tr}</s-badge>`:''}</s-stack></s-stack></s-box>`;
 panel=`<s-section heading="${T.overview}"><s-stack gap="base"><s-stack direction="inline" justifyContent="space-between" alignItems="center"><s-text color="subdued">${T.intro}</s-text>
  <s-stack direction="inline" gap="small-300">${T.p.map((x,i)=>`<s-button ${i===1?'variant="primary"':''}>${x}</s-button>`).join('')}</s-stack></s-stack>
  <s-grid gridTemplateColumns="repeat(4,1fr)" gap="base">${T.stats.map(stat).join('')}</s-grid></s-stack></s-section>
  <div style="height:14px"></div>
  <s-section heading="${T.deliveries}" padding="base"><s-table><s-table-header-row>${T.cols.map(c=>`<s-table-header>${c}</s-table-header>`).join('')}</s-table-header-row><s-table-body>
  ${T.rows.map(([p,v,d,a,qn,st,tone])=>`<s-table-row><s-table-cell><s-stack direction="inline" gap="small" alignItems="center"><s-thumbnail src="${thumbs[p]}" size="small" alt=""></s-thumbnail><s-stack gap="none"><s-link>${p}</s-link><s-text color="subdued">${v}</s-text></s-stack></s-stack></s-table-cell><s-table-cell>${d}</s-table-cell>
   <s-table-cell><s-stack direction="inline" gap="small" alignItems="center"><div class="bar-progress"><i style="width:${Math.round(a/qn*100)}%"></i></div><s-text>${a} ${T.of} ${qn}</s-text></s-stack></s-table-cell><s-table-cell><s-badge ${tone?`tone="${tone}"`:''}>${st}</s-badge></s-table-cell></s-table-row>`).join('')}
  </s-table-body></s-table></s-section>`;
} else {
 panel=`<s-section heading="${T.variant}"><s-stack gap="base">
  <s-switch label="${T.toggle}" details="${T.toggleD}" checked></s-switch>
  <s-grid gridTemplateColumns="1fr 1fr 1fr auto" gap="base" alignItems="center">
   <s-stack gap="none"><s-text color="subdued">${T.active}</s-text><s-text>${T.activeV}</s-text></s-stack>
   <s-stack gap="none"><s-text color="subdued">${T.stock}</s-text><s-text>${T.stockV}</s-text></s-stack>
   <s-stack gap="none"><s-text color="subdued">${T.synced}</s-text><s-text>${T.syncedV}</s-text></s-stack>

  <s-box padding="base" border="base" borderRadius="base"><s-stack gap="small"><s-stack direction="inline" gap="small" alignItems="center"><s-text>${T.mode}</s-text><s-badge tone="success">${T.modeV}</s-badge></s-stack><s-paragraph>${T.modeT}</s-paragraph><s-checkbox label="${T.force}"></s-checkbox></s-stack></s-box>
  <s-table><s-table-header-row>${T.dcols.map(c=>`<s-table-header>${c}</s-table-header>`).join('')}</s-table-header-row><s-table-body>
   ${T.drows.map(r=>`<s-table-row>${r.slice(0,5).map(c=>`<s-table-cell>${c}</s-table-cell>`).join('')}<s-table-cell><s-badge ${r[6]?`tone="${r[6]}"`:''}>${r[5]}</s-badge></s-table-cell></s-table-row>`).join('')}
  </s-table-body></s-table>
  <s-box padding="base" border="base" borderRadius="base"><s-stack gap="base"><s-heading>${T.newD}</s-heading>
   <s-grid gridTemplateColumns="1fr 1fr" gap="base"><s-date-field label="${T.date}" value="2027-01-23"></s-date-field><s-number-field label="${T.qty}" value="60"></s-number-field></s-grid>
   <s-stack direction="inline"><s-button variant="primary">${T.add}</s-button></s-stack></s-stack></s-box>
 </s-stack></s-section>`;
}
document.getElementById('root').innerHTML=`<div class="glow" style="left:700px;top:0;width:900px;height:900px"></div>`+ring(560,420,1040,300,-9)+`<div class="panel"><div class="bar"><img src="preaura-ikon-dark.png">PREAURA</div>${panel}</div>
 <div class="copy"><div class="eyebrow">${eb}</div><h1>${h}</h1><p class="sub">${sub}</p></div><div class="brand">PREAURA<b>.</b></div>`;
Promise.all([document.fonts.ready,customElements.whenDefined('s-section')]).then(()=>setTimeout(()=>document.body.dataset.ready=1,1500));
</script></body></html>
