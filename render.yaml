# Opsætning af PREAURA på Render (render.com). Render læser filen, når man
# vælger New → Blueprint og peger på dette repo. Den opretter appen og
# databasen i Frankfurt (EU) og udruller selv ved hver merge til main.

databases:
  - name: preaura-db
    databaseName: preaura
    user: preaura
    plan: basic-256mb
    region: frankfurt
    postgresMajorVersion: "16"
    # Ingen adgang udefra — kun appen på Render kan nå databasen.
    ipAllowList: []

services:
  - type: web
    name: preaura
    runtime: node
    plan: starter
    region: frankfurt
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # Databasens migrationer køres, før den nye version tager over.
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start
    healthCheckPath: /healthz
    envVars:
      # Nyeste Node.js 22. Nogle pakker kræver mindst 22.20 (se engines i
      # package.json); en fast, ældre version får buildet til at fejle.
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: preaura-db
          property: connectionString
      # Appens client ID. Ikke hemmelig — den står også i shopify.app.toml.
      - key: SHOPIFY_API_KEY
        value: 5021b1e5a0b9cb456c79906ba0d09bd4
      # Client secret fra Shopify Dev Dashboard. Render spørger efter den
      # første gang; den står aldrig i repoet.
      - key: SHOPIFY_API_SECRET
        sync: false
      # Krypterer API-nøgler, webhook-adresser og kundeoplysninger i
      # databasen. Render laver selv en tilfældig værdi første gang. Må ikke
      # ændres bagefter — så kan de gemte værdier ikke læses.
      - key: PREAURA_ENCRYPTION_KEY
        generateValue: true
      - key: SCOPES
        value: read_products,write_products,read_inventory,write_inventory,read_orders,write_orders,write_purchase_options
