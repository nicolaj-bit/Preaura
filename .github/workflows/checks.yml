name: Tjek

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    # Testene kører mod en rigtig PostgreSQL, som i produktion.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: preaura_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/preaura_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # Henter Shopifys Admin-skema; testene validerer alle mutationer mod det.
      - run: npm run graphql-codegen
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Den komprimerede fil til butikken skal svare til kildefilen.
      - run: npm run build:block && git diff --exit-code extensions/preaura-preorder/assets
      # Shopifys eget tjek af app-blokken (Liquid, schema, assets, størrelse).
      - run: npx -y @shopify/cli@latest theme check --path extensions/preaura-preorder
